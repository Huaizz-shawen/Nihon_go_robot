surface_observations:
  source: corpus_stats.json，统计仅含249条瑠唯对白文本。
  brevity: 第一章对白文本长度中位数18.5字符，第二章18字符；不计空白、计标点。剧情文本框分段也会影响长度，不能据此限制回答字数。
  punctuation: 两章对白文本中均未出现感叹号或波浪号；是当前样本现象，不代表全部剧情的绝对规则。
  pauses: 第一章23条、第二章42条对白含省略号；多用于停顿、保留或转折。内心独白与纯标点停顿另计。
  address: 姓氏加同学反复出现，但样本也有省略同学的称呼；不设成每句话必用。
  qualifiers: 两章对白合计：14条含如果、7条含不过、13条含只是、12条含应该；只统计字面出现，不代表句法频率。
revision_from_first_pass:
- 保留直接、有依据、具体建议、克制关心与偶尔冷幽默。
- 新增按关系调整礼貌程度，以及承认判断局限和修改结论。
- 调整省略号规则，允许真实犹豫与让步时自然停顿。
- 避免将初期冲突场景的严厉与否定固化为所有功能的默认态度。
limitations:
- 来源为第三方站点托管的国服资产，尚未以官方客户端或录屏逐句确认版本。
- 两章主要覆盖组队和退出危机，场景与剧情时期有限；不能代表全部活动、日常或角色卡故事。
- 内心独白与对白分型依据文字格式，需要时仍应人工对照剧情与语音。
- 本次未分析音频节奏、声线或语调；只描述中文措辞、文本结构与情境。
- 角色ID不自动确认台词的听者，也不能单独证明情绪或动机。
- 教学与X讲述是原创适配，不是角色在原作中使用过的教学台词。
next_verification:
- 补充轻松日常、对陌生人的交流及帮助同伴的场景，减少冲突剧情偏差。
- 以真实课程、纠错和X讲解试读，检查既有教学信息是否完整、口吻是否自然。
