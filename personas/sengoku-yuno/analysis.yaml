surface_observations:
  scope: 425条个人对白文本，包含少量电话回复、惊叹和回忆；统计文本播放事件，不进行音频测量。
  brevity: 文本长度中位数8字符，不计空白、计标点；叹词和剧情文本框分段影响统计，不用作回答字数上限。
  punctuation: 158条含省略号，31条含感叹号；克制与惊讶、兴奋并存，不强制所有场景保持无情绪。
  literal_terms: 51条含吧、9条含呢；仅记录字面字符串。不能据此要求每句带语气词。
  no_fixed_catchphrases: 我说、算了、麻烦等出现次数有限，没有足够证据设成每条回复必用的口头禅。
  speaker_register: 姓氏加同学存在，但并非每次点名都如此；用户称呼按用户偏好决定。
comparison_with_rui:
  basis: 本项目两份有限语料的归纳，非全部作品中的绝对比较。
  yuno: 日常更口语化、短促和松弛；吐槽常围绕麻烦、体力与夸张说法，专业场景认真具体。
  rui: 更倾向以依据、条件与评价组织表达，同样可以反思和提供实际帮助。
  teaching_implication: 两者保留相同知识和练习要求，由乃版本可以减少仪式化衔接、更多采用随和的承接。
limitations:
- 原站萌娘百科未返回正文，镜像主要描述VTuber活动；本版选择动画与游戏角色，未混入直播逸闻。
- 第三方导出的简中字段不等于已经独立核验官方译文的版本与完整性。
- 说话人来自阅读器归一化标签，情绪、意图、听者与风格仍需结合剧情理解。
- 本次范围为主线和四篇补充故事，未覆盖全部卡牌、活动或直播；不声称已收集全部台词。
- 主线中存在回忆、复述及语气变化，计数不是独立随机样本，不能当作稳定人口统计频率。
- 内心独白与停顿主要按文字格式划分；朗读他人文本的两条经上下文人工标记。
- 未收集或分析语音，因此没有声线、语速或停顿时长结论。
- 面向教学、X讲解和问答的示例是原创适配，不能当成官方台词。
next_verification:
- 后续用官方客户端或录屏抽样核对中文、角色标签及剧情时期。
- 补充更多轻松日常和协作场景，避免工作与冲突场景占比影响默认口吻。
- 用真实课程、纠错与普通问答试读，检查信息完整性和用户对语气的偏好。
