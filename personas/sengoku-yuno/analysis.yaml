version: 1
status: speaker_attributed_first_pass
method:
  primary_source_id: moenotes_zh_cn
  material: Our Notes梦限大MewType主线20话、由乃视角1话与番外3话，共24篇。
  requested_locale: zh-CN
  source_language_check: 每条解析文本与资产 _simplifiedChinese 字段去除已知排版标签后的内容核对；字段为空、内容不一致或语言回退都会终止采集。
  speaker_status: 使用阅读器的明确speakerId（yuno、adv_yuno）与显示姓名由乃交叉确认；角色资料ID=15、bandId=3。
  attribution_limit: 已核验第三方页面的说话人标签与中文字段，但未独立重放游戏核实标签和译文版本。
  ordering: 按initialScript.timeline的line引用顺序；视频字幕与游戏文本分别标记，字幕只计一次，不重复统计视频与字幕展开列表。
  context: 每条文本保留同篇内前后各两条记录，分析结合所在篇的连续上下文。
  exclusions: 多人合声不用于个人风格统计；内心独白、纯标点停顿与朗读他人动态另计。
  annotation_file: annotations.json；第18话朗读阿拉蕾动态的两条排除在个人对白统计之外；电话中的引号回复仍保留为对白。
  counting_unit: 一次文本播放事件，并非一个句子、一段音频或一个独立样本。
